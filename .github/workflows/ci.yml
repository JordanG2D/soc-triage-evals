name: Offline regression
on:
  push:
    branches: [main]
    paths-ignore: ['.budget/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev
      - name: Acquire pinned public embedding assets
        run: uv run --frozen python scripts/prepare_embeddings.py
      - name: Validate all offline tests and fixed regression baseline
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          uv run --frozen pytest -q
          uv run --frozen soc-triage offline
          uv run --frozen python scripts/run_inspect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
