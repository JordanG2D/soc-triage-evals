name: Bounded live development slice
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lifetime-live-budget
  cancel-in-progress: false
jobs:
  vertical-slice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and validate before allocating any money
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev
          uv run --frozen python scripts/prepare_embeddings.py
          HF_HUB_OFFLINE=1 uv run --frozen pytest -q
          HF_HUB_OFFLINE=1 uv run --frozen soc-triage offline
      - name: Check secret presence without displaying values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --frozen python -c 'import os; assert all(os.environ.get(k) for k in ("OPENAI_API_KEY","ANTHROPIC_API_KEY")), "Both provider secrets are required"'
      - name: Durably allocate $5 within lifetime $20 cap
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/allocate_live_budget.py
      - name: Run only the authorized vertical slice
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_HUB_OFFLINE: '1'
        run: uv run --frozen soc-triage live --output artifacts/live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-vertical-slice-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            .state/
          if-no-files-found: error
          retention-days: 90
